name: Update Supermarket Prices

on:
  # הרצה אוטומטית פעם ביום ב-06:00 שעון ישראל
  # הרשתות מעדכנות מחירים פעם ביום/יומיים, אז מספיק עדכון בוקר אחד
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC = 06:00 Israel (winter) / 07:00 Israel (summer)

  # אפשרות להרצה ידנית מ-GitHub
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Seed products with barcodes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/seed_products.py

      - name: Run price scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/scrape_prices.py

      - name: Log completion
        run: |
          echo "Price update completed at $(date)"
