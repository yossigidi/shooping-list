name: Update Supermarket Prices

on:
  # הרצה אוטומטית פעמיים ביום (6:00 ו-18:00 שעון ישראל)
  schedule:
    - cron: '0 4,16 * * *'  # UTC time (Israel is UTC+2/+3)

  # אפשרות להרצה ידנית מ-GitHub
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run price scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/scrape_prices.py

      - name: Log completion
        run: |
          echo "Price update completed at $(date)"
