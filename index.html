<body>
    <!-- WCAG 2.4.1 Skip Link -->
    <a href="#main-content" class="skip-link">דלג לתוכן הראשי</a>

    <!-- WCAG 4.1.3 Status Messages - Live Region for announcements -->
    <div id="aria-live-region" aria-live="polite" aria-atomic="true" class="sr-only"></div>
    <div id="aria-live-assertive" aria-live="assertive" aria-atomic="true" class="sr-only"></div>

    <!-- Loading skeleton - shows instantly while JS loads -->
    <div id="loading-skeleton" style="position:fixed;inset:0;z-index:99999;min-height:100vh;min-height:100dvh;background:#f0fdfa;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Heebo,sans-serif;">
        <style>
            @keyframes fadeIn{from{opacity:0}to{opacity:1}}
            @keyframes spin{to{transform:rotate(360deg)}}
            @keyframes skFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
            .splash-fade{animation:fadeIn 0.3s ease-out}
            .splash-spin{animation:spin 1s linear infinite}
            .splash-float{animation:skFloat 2s ease-in-out infinite}
        </style>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;" class="splash-fade">
            <img src="splash.png" alt="ListNest" style="width:100%;height:100%;object-fit:contain;object-position:center;">
            <div style="position:absolute;top:50px;text-align:center;padding:0 20px;">
                <h1 style="font-size:36px;font-weight:700;color:#0d9488;margin:0;text-shadow:0 2px 10px rgba(13,148,136,0.2);">ListNest</h1>
                <p style="font-size:20px;color:#14b8a6;margin:12px 0 0 0;font-weight:600;">רשימת קניות משפחתית חכמה</p>
            </div>
            <div style="position:absolute;bottom:60px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#14B8A6;">
                <div style="width:32px;height:32px;border:3px solid #99f6e4;border-top-color:#14B8A6;border-radius:50%;" class="splash-spin"></div>
                <span style="font-size:16px;font-weight:500;">טוען...</span>
            </div>
        </div>
    </div>
    <div id="root"></div>
    <script>
        // Global error handler for debugging - XSS safe version
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var root = document.getElementById('root');
            while (root.firstChild) root.removeChild(root.firstChild);
            var container = document.createElement('div');
            container.style.cssText = 'padding:20px;direction:rtl;font-family:Heebo,sans-serif;';
            var title = document.createElement('h2');
            title.style.color = 'red';
            title.textContent = 'שגיאה:';
            var pre = document.createElement('pre');
            pre.style.cssText = 'background:#f5f5f5;padding:10px;overflow:auto;font-size:12px;';
            var safeMsg = String(msg).substring(0, 500).replace(/[<>]/g, '');
            pre.textContent = safeMsg + '\nLine: ' + lineNo;
            var btn = document.createElement('button');
            btn.style.cssText = 'padding:10px 20px;margin-top:10px;';
            btn.textContent = 'נסה שוב';
            btn.onclick = function() { location.reload(); };
            container.appendChild(title);
            container.appendChild(pre);
            container.appendChild(btn);
            root.appendChild(container);
            return false;
        };
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            // Force clear all old caches on load
            caches.keys().then(names => {
                names.forEach(name => {
                    if (!name.includes('v152')) {
                        caches.delete(name);
                        console.log('Deleted old cache:', name);
                    }
                });
            });
            window.addEventListener('load', () => {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(reg => {
                        reg.update();
                        console.log('SW update triggered');
                    });
                });
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }
    </script>
</body>
